services:
  - type: web
    name: calorie-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: REDIS_URL
        value: ""
      - key: LOG_LEVEL
        value: INFO
